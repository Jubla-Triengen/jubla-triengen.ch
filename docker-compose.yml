services:
  db:
    image: postgres:16-alpine
    container_name: jubla-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jubla_cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d jubla_cms"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
